[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-innovation"
version = "0.1.0"
description = "Rule and DINOv2 patch image-level anomaly detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10",
    "torch>=2.0",
]

[project.scripts]
pro-innovation = "pro_innovation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
